# Pila de PRODUCCION. Imagenes compiladas, sin codigo montado y sin exponer la
# base de datos al host.
#
#   just prod-up     (docker compose -f compose.prod.yaml up -d --build)
#   just prod-down
#
# En un despliegue real la contrasena de Postgres viene del gestor de secretos,
# no de .env. Aqui hay valor por defecto solo para poder probar la pila en local.

name: gastonomo-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastonomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastonomo}
      POSTGRES_DB: ${POSTGRES_DB:-gastonomo}
    # Sin puertos publicados: solo se llega desde la red interna de compose.
    expose:
      - '5432'
    volumes:
      # postgres:18 guarda los datos en un subdirectorio por version mayor: el
      # volumen va en /var/lib/postgresql, no en /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gastonomo} -d ${POSTGRES_DB:-gastonomo}']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: gastonomo-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GASTONOMO__SERVER__HOST: 0.0.0.0
      GASTONOMO__SERVER__PORT: '8080'
      GASTONOMO__DATABASE__URL: postgres://${POSTGRES_USER:-gastonomo}:${POSTGRES_PASSWORD:-gastonomo}@db:5432/${POSTGRES_DB:-gastonomo}
      GASTONOMO__TELEMETRY__LOG_LEVEL: ${GASTONOMO__TELEMETRY__LOG_LEVEL:-info}
    expose:
      - '8080'
    # El Dockerfile ya trae HEALTHCHECK contra /health/live; aqui solo se ajustan
    # los tiempos al arranque real de produccion.
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:8080/health/live || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  web:
    build:
      # Contexto en la raiz: el lockfile de pnpm vive aqui.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Se compila DENTRO del bundle: hay que fijarla en tiempo de build.
        # Por defecto, el origen publico del gateway. En un despliegue real se
        # pasa el dominio: WEB_API_URL=https://gastonomo.example
        VITE_API_URL: ${WEB_API_URL:-http://localhost:${PUBLIC_PORT:-8080}}
    image: gastonomo-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # Unico punto de entrada. La web y la API viven detras, en la red interna.
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${PUBLIC_PORT:-8080}:8080'
    volumes:
      - ./docker/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8080/health/live || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M

volumes:
  postgres-data:
