# Pila de PRODUCCION para apps-01, la instancia de Lightsail compartida.
#
# Este fichero es autocontenido y es lo UNICO que hace falta en el servidor: sin
# codigo, sin lockfile y sin clonar el repositorio. Se copia junto a un .env
# como /srv/apps/gastonomo/compose.yaml y:
#
#   docker compose pull
#   docker compose up -d --wait
#
# Las imagenes las publica la CI y van fijadas por SHA de commit. GASTONOMO_TAG
# no tiene valor por defecto a proposito: desplegar lo que apunte `latest` es
# como se acaba sin poder decir que esta corriendo, y el rollback deja de existir.
#
# AQUI NADIE PUBLICA PUERTOS. El unico contenedor de la maquina que los publica
# es Caddy, que termina TLS y reparte por nombre de contenedor sobre la red
# externa `edge`:
#
#   gastonomo.bahoque.com      -> gastonomo-web:8080  (la SPA)
#                              -> gastonomo-api:8080  en /v1/, /health/ y
#                                 /openapi.json, que son las rutas de la API
#   api.gastonomo.bahoque.com  -> gastonomo-api:8080  (la app Android necesita
#                                 una URL absoluta)
#
# Ese reparto por prefijo en Caddy es lo que sustituye al gateway de nginx que
# tenia la pila local, y es lo que mantiene a la web y a la API en el MISMO
# origen. Importa: la API no manda cabeceras CORS, asi que si la SPA llamase a
# api.gastonomo.bahoque.com el navegador bloquearia todas las llamadas. Con el
# reparto por prefijo el bundle apunta a su propio origen y no hay CORS que
# configurar. La lista de prefijos es la misma que enruta docker/gateway.prod.conf
# en la pila local, y las dos tienen que decir lo mismo: si se anade un prefijo a
# la API hay que anadirlo tambien en caddy/conf/apps/gastonomo.caddy del
# repositorio de infraestructura, o caera al nginx de la SPA, que contesta el
# index.html con 200 a un GET y 405 a un POST. /swagger-ui no esta en ninguna de
# las dos: solo se sirve en api.gastonomo.bahoque.com.
#
# La pila local completa, con build y gateway, vive en infra/compose.smoke.yaml.

name: gastonomo

services:
  db:
    image: postgres:18-alpine
    container_name: gastonomo-db
    restart: unless-stopped
    environment:
      # Obligatorias, al contrario que en desarrollo: el par por defecto del
      # repositorio lo conoce cualquiera y no puede ser el de una maquina publica.
      POSTGRES_USER: ${POSTGRES_USER:?ponlo en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ponlo en .env, y que sea aleatorio}
      POSTGRES_DB: ${POSTGRES_DB:?ponlo en .env}
    # Sin puertos y solo en la red privada de este compose: la base de datos no
    # entra en `edge`, asi que ningun otro inquilino de la maquina la alcanza.
    volumes:
      # postgres:18 guarda los datos en un subdirectorio por version mayor: el
      # volumen va en /var/lib/postgresql, NO en /var/lib/postgresql/data. Con
      # la ruta antigua el contenedor no arranca.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          # La maquina tiene 4 GB y ya hay otro inquilino. Con limite, un pico
          # de esta base de datos no se lleva por delante a Caddy ni a Grimdex.
          memory: 512M
    logging:
      # El disco es de 80 GB y json-file sin limite se lo come. El servidor ya
      # lo tiene puesto en daemon.json; aqui se repite para que el fichero no
      # dependa de como este configurada la maquina.
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    image: ghcr.io/eabl0306/gastonomo-api:${GASTONOMO_TAG:?ponlo al SHA del commit que se despliega}
    container_name: gastonomo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GASTONOMO__SERVER__HOST: 0.0.0.0
      GASTONOMO__SERVER__PORT: '8080'
      GASTONOMO__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GASTONOMO__DATABASE__MAX_CONNECTIONS: ${GASTONOMO__DATABASE__MAX_CONNECTIONS:-10}
      GASTONOMO__DATABASE__ACQUIRE_TIMEOUT_MS: ${GASTONOMO__DATABASE__ACQUIRE_TIMEOUT_MS:-3000}
      GASTONOMO__TELEMETRY__LOG_LEVEL: ${GASTONOMO__TELEMETRY__LOG_LEVEL:-info}

      # Firma los access token. Sin valor por defecto: el del repositorio es
      # publico y con el cualquiera se firma un token de cualquier cuenta.
      #   openssl rand -hex 32
      GASTONOMO__AUTH__ACCESS_TOKEN_SECRET: ${GASTONOMO__AUTH__ACCESS_TOKEN_SECRET:?generalo con openssl rand -hex 32}
      GASTONOMO__AUTH__ACCESS_TOKEN_MINUTES: ${GASTONOMO__AUTH__ACCESS_TOKEN_MINUTES:-15}
      GASTONOMO__AUTH__REFRESH_TOKEN_DAYS: ${GASTONOMO__AUTH__REFRESH_TOKEN_DAYS:-30}
      # El enlace que viaja en el correo de recuperacion. Se compone del origen
      # publico para que el `{token}` que la API exige no se pueda olvidar.
      GASTONOMO__AUTH__RESET_LINK_TEMPLATE: ${PUBLIC_WEB_ORIGIN:?e.g. https://gastonomo.bahoque.com}/reset-password?token={token}
      # Ventana en memoria del proceso, por IP. Detras de Caddy la IP sale de la
      # ULTIMA entrada de X-Forwarded-For, que es la que anade el proxy; Caddy la
      # anade por defecto en reverse_proxy. Si algun dia la API se expusiera sin
      # proxy delante, el borde tendria que sobreescribir esa cabecera.
      GASTONOMO__AUTH__RATE_LIMIT_MAX_REQUESTS: ${GASTONOMO__AUTH__RATE_LIMIT_MAX_REQUESTS:-10}
      GASTONOMO__AUTH__RATE_LIMIT_WINDOW_SECONDS: ${GASTONOMO__AUTH__RATE_LIMIT_WINDOW_SECONDS:-60}

      # Correo saliente. En produccion driver=smtp: con `log` el correo de
      # recuperacion se queda en el log del contenedor y nadie recupera nada.
      # El transporte solo sabe hacer STARTTLS o texto en claro, asi que el
      # puerto es el 587 y STARTTLS va en true. El 465 (TLS implicito) NO vale.
      GASTONOMO__MAIL__DRIVER: ${GASTONOMO__MAIL__DRIVER:-smtp}
      # Solo importa con driver smtp.
      GASTONOMO__MAIL__HOST: ${GASTONOMO__MAIL__HOST:-localhost}
      GASTONOMO__MAIL__PORT: ${GASTONOMO__MAIL__PORT:-587}
      # Vacio significa sin autenticacion. Solo importa con driver smtp.
      GASTONOMO__MAIL__USERNAME: ${GASTONOMO__MAIL__USERNAME:-}
      # Opcional a proposito, aunque parezca lo contrario. Exigirla aqui ata dos
      # cosas que no van juntas: no se podia desplegar la aplicacion hasta tener
      # cuenta de correo, y el primer despliegue murio justo por eso. Con
      # GASTONOMO__MAIL__DRIVER=log no hay SMTP al que autenticarse y esta
      # variable no pinta nada; cuando el driver pasa a smtp, es la propia API
      # la que falla al arrancar si falta, que es donde corresponde comprobarlo.
      GASTONOMO__MAIL__PASSWORD: ${GASTONOMO__MAIL__PASSWORD:-}
      GASTONOMO__MAIL__FROM: ${GASTONOMO__MAIL__FROM:?e.g. Gastonomo <no-reply@bahoque.com>}
      GASTONOMO__MAIL__STARTTLS: ${GASTONOMO__MAIL__STARTTLS:-true}

      # El dictado. Opcional: sin clave la API arranca igual y el endpoint
      # responde 503, que es lo que dice "no ha fallado nada, falta un dato".
      # Es una capacidad que se paga por uso, asi que una instancia puede
      # querer no tenerla y el resto de la aplicacion no se entera.
      GASTONOMO__CLAUDE__API_KEY: ${GASTONOMO__CLAUDE__API_KEY:-}

      # Aqui SI sale a Frankfurter: es el unico sitio donde se quiere. La tarea
      # refresca a las 06:00 y 18:00 UTC y al arrancar si hace falta. Apagada,
      # /v1/exchange-rates responde 503 y el catalogo de monedas sale vacio.
      GASTONOMO__EXCHANGE_RATES__ENABLED: ${GASTONOMO__EXCHANGE_RATES__ENABLED:-true}
      GASTONOMO__EXCHANGE_RATES__BASE_URL: ${GASTONOMO__EXCHANGE_RATES__BASE_URL:-https://api.frankfurter.dev/v2}
      GASTONOMO__EXCHANGE_RATES__REFRESH_HOURS_UTC: ${GASTONOMO__EXCHANGE_RATES__REFRESH_HOURS_UTC:-6,18}
      GASTONOMO__EXCHANGE_RATES__REQUEST_TIMEOUT_MS: ${GASTONOMO__EXCHANGE_RATES__REQUEST_TIMEOUT_MS:-10000}
      GASTONOMO__EXCHANGE_RATES__RETRY_ATTEMPTS: ${GASTONOMO__EXCHANGE_RATES__RETRY_ATTEMPTS:-3}
      GASTONOMO__EXCHANGE_RATES__RETRY_BACKOFF_MS: ${GASTONOMO__EXCHANGE_RATES__RETRY_BACKOFF_MS:-2000}
    # `default` es la red privada de este compose, por donde habla con db.
    # `edge` es la compartida, por donde la alcanza Caddy. Nada mas.
    networks: [default, edge]
    healthcheck:
      # /health/live no toca la base de datos: responde 200 mientras el proceso
      # este vivo. La imagen trae curl.
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:8080/health/live || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    image: ghcr.io/eabl0306/gastonomo-web:${GASTONOMO_TAG:?ponlo al SHA del commit que se despliega}
    container_name: gastonomo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # VITE_API_URL se compila DENTRO del bundle, en la CI, y aqui no se puede
    # cambiar: la imagen tiene que estar construida con el origen publico de la
    # web (https://gastonomo.bahoque.com), porque es Caddy quien manda /v1/ a la
    # API bajo ese mismo origen. Cambiarlo significa reconstruir la imagen.
    networks: [default, edge]
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # Creada a mano una vez en la maquina y compartida por todas las apps:
  #   docker network create edge
  # External a proposito: un `docker compose down` aqui no puede borrar la red a
  # la que siguen enganchados Caddy y Grimdex.
  edge:
    external: true

volumes:
  postgres-data:
