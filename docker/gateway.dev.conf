# Puerta de entrada del entorno de desarrollo: la web y la API bajo un mismo
# origen. Sin esto el navegador bloquea las llamadas del front a la API, porque
# son puertos distintos y la API no manda cabeceras CORS.
#
# Este fichero se incluye dentro del bloque http de nginx (conf.d).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream gastonomo_web {
  server web:5173;
}

upstream gastonomo_api {
  server api:8080;
}

server {
  listen 8080;
  server_name _;

  # La API. Todo lo que no sea de la API lo sirve la web.
  location /health/ {
    proxy_pass http://gastonomo_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /openapi.json {
    proxy_pass http://gastonomo_api;
    proxy_set_header Host $host;
  }

  location /swagger-ui {
    proxy_pass http://gastonomo_api;
    proxy_set_header Host $host;
  }

  # La web, con el websocket de HMR de Vite incluido.
  location / {
    proxy_pass http://gastonomo_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
