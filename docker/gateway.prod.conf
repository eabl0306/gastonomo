# Puerta de entrada de produccion: un solo origen para la web y la API.
# La web y la API no publican puertos al host; se entra siempre por aqui.
#
# Este fichero se incluye dentro del bloque http de nginx (conf.d).

upstream gastonomo_web {
  server web:8080;
}

upstream gastonomo_api {
  server api:8080;
}

server {
  listen 8080;
  server_name _;

  # Cabeceras de seguridad basicas. El resto de politicas van en la web.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /health/ {
    proxy_pass http://gastonomo_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /openapi.json {
    proxy_pass http://gastonomo_api;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://gastonomo_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
