# Web en React: lint con las reglas de arquitectura, tipos, tests con umbral de
# cobertura, codigo muerto, build, e2e de Playwright e imagen de produccion.
name: web

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  verify:
    name: verificacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (capas hexagonales, complejidad, hooks, accesibilidad)
        run: pnpm --filter @gastonomo/web lint

      - name: Tipos
        run: pnpm --filter @gastonomo/web typecheck

      - name: Tests con cobertura (60% global, 80% en dominio y aplicacion)
        run: pnpm --filter @gastonomo/web test:coverage

      - name: Build
        run: pnpm --filter @gastonomo/web build

      - name: Codigo muerto
        run: pnpm --filter @gastonomo/web knip

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar chromium
        run: pnpm --filter @gastonomo/web exec playwright install --with-deps chromium

      # El propio playwright.config.ts hace el build y levanta el preview en 4173.
      # Los tests interceptan la red, asi que no hacen falta ni API ni Postgres.
      - name: Tests e2e
        run: pnpm --filter @gastonomo/web e2e

      - name: Subir el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: imagen docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de produccion
        uses: docker/build-push-action@v7
        with:
          # El contexto es la raiz: el lockfile de pnpm vive alli.
          context: .
          file: apps/web/Dockerfile
          push: false
          # load: true deja la imagen en el docker local para poder arrancarla.
          load: true
          tags: gastonomo-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Construir no prueba nada: un nginx.conf roto compila igual de bien. Aqui
      # se levanta la imagen y se comprueba lo que de verdad tiene que cumplir.
      - name: Arrancar el contenedor
        run: docker run -d --name gastonomo-web-ci -p 8080:8080 gastonomo-web:ci

      - name: Healthcheck
        run: curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8080/healthz

      - name: Fallback del SPA y raiz
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/ruta/inexistente

      - name: Cabeceras de seguridad
        run: |
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/)"
          for header in X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            echo "${headers}" | grep -qi "^${header}:" \
              || { echo "falta la cabecera ${header}"; echo "${headers}"; exit 1; }
          done

      - name: Logs del contenedor
        if: failure()
        run: docker logs gastonomo-web-ci

      - name: Parar el contenedor
        if: always()
        run: docker rm -f gastonomo-web-ci
