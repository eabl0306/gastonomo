# Unico punto de entrada de la CI. Mira que ha cambiado, llama a los workflows
# que hagan falta y deja un check final, "all-green", que es el que se marca
# como required en la proteccion de rama.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # En un pull request, un empujon nuevo deja la ejecucion anterior sin sentido y
  # se cancela. En main NO se cancela, y no es por gusto: desde que el despliegue
  # cuelga de esta misma ejecucion, cancelarla a mitad cortaria un `docker compose
  # up` por la mitad y dejaria la maquina entre dos etiquetas. El grupo de
  # concurrencia de deploy.yml no protege de eso, porque quien cancela es el
  # workflow de arriba, no otro despliegue.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: que ha cambiado
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/api.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/web.yml'
              - '.github/workflows/ci.yml'
            stack:
              - 'compose.yaml'
              - 'infra/compose.smoke.yaml'
              - 'docker/**'
              - 'tools/scripts/smoke-stack.sh'
              - '.github/workflows/stack.yml'
              - '.github/workflows/ci.yml'
            android:
              - 'apps/android/**'
              - '.github/workflows/android.yml'
              - '.github/workflows/ci.yml'

  quality:
    name: calidad
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
      # Un workflow reutilizable no puede tener mas permisos de los que le da
      # quien lo llama. gitleaks los necesita para leer los commits de un PR.
      pull-requests: read
    # Un workflow reutilizable no ve los secretos del que lo llama si no se le
    # pasan. Sin esta linea, GITLEAKS_LICENSE llegaba siempre vacia.
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/api.yml
    permissions:
      contents: read

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml
    permissions:
      contents: read

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
      security-events: write

  stack:
    name: pila
    needs: changes
    # La composicion se prueba si cambia cualquiera de las tres piezas que la
    # forman: la API, la web o los ficheros de compose y del gateway.
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.stack == 'true'
    uses: ./.github/workflows/stack.yml
    permissions:
      contents: read

  all-green:
    name: all-green
    if: always()
    needs: [changes, quality, api, web, android, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que nada ha fallado
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "resultados: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::un job requerido termino en '${result}'"
              exit 1
            fi
          done
          echo "todo en verde"

  # ---------------------------------------------------------------------------
  # Despliegue. Va aqui dentro, y no en un workflow aparte con un trigger de
  # workflow_run, por una razon concreta: all-green ya es "todo lo anterior esta
  # verde", asi que colgarse de el es la forma mas corta y mas legible de decir
  # "solo si la CI paso". Un workflow_run tendria que reconstruir ese juicio y
  # ademas corre con el fichero de la rama por defecto y con un github.sha que no
  # es el del commit que lo disparo, que es una trampa clasica.
  #
  # Esto NO cambia lo que significa all-green ni bloquea ningun merge: all-green
  # no depende de estos dos jobs (no estan en su `needs`), y los dos solo corren
  # en push a main, o sea cuando el PR ya se ha fundido. En un pull request se
  # saltan sin aparecer como check.
  #
  # Los filtros de rutas tampoco les afectan: release.yml construye las dos
  # imagenes siempre, porque el servidor fija una sola etiqueta para las dos.
  release:
    name: publicar imagenes
    needs: [all-green]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: desplegar
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    # Un workflow reutilizable no ve los secretos del que lo llama si no se le
    # pasan: la misma trampa que con GITLEAKS_LICENSE en quality.yml.
    secrets: inherit
