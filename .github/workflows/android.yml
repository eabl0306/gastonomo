# App nativa de Android: detekt, sourceGuard, Android Lint, tests unitarios,
# cobertura con Kover y APK de debug. `./gradlew check` encadena casi todo.
name: android

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/android

jobs:
  verify:
    name: verificacion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # El identificador del paquete lleva la revision: es "android-37.0", no
      # "android-37". Con el nombre corto sdkmanager no encuentra nada y el paso
      # muere despues de volcar todas las licencias, que es un log enorme donde
      # el error de verdad no se ve. Los ids reales se consultan en
      # https://dl.google.com/android/repository/repository2-3.xml
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0

      # Dependabot propone la v6 y aqui se para a proposito en la v5. Los dos
      # motivos son de la v6.0.0. Uno: la cache se movio a 'gradle-actions-caching',
      # un componente propietario que ya no es MIT y cuyo uso obliga a aceptar
      # https://gradle.com/legal/terms-of-use/, que es una decision de licencia y
      # no se toma en una subida de version. Dos: quito el soporte de configuration
      # cache, que este proyecto tiene encendido (org.gradle.configuration-cache
      # en gradle.properties). La v5 ya corre en node24, que es lo que obligaba a
      # dejar la v4, asi que no se pierde nada por esperar.
      # Para reabrirlo: aceptar esos terminos, o pasar a la v6 con el
      # 'cache-provider: basic' que anadio la v6.1.0, que si es MIT pero no limpia
      # ni deduplica la cache y ademas ignora el gradle-home-cache-includes de abajo.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # La cache tiene que invalidarse cuando cambian el catalogo de
          # versiones, el wrapper o los convention plugins.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # check = detekt + sourceGuard + lint + tests + koverVerify en todos los
      # modulos y en la raiz. El XML de cobertura hay que pedirlo aparte.
      #
      # Los tests tambien capturan las 14 pantallas con Roborazzi, asi que las
      # imagenes salen de este mismo paso y se suben como artefacto: no se
      # comparan contra una referencia versionada, se miran.
      #
      # assembleDebugAndroidTest no es decorativo: 'check' no compila las fuentes
      # de androidTest, asi que sin el un test instrumentado roto pasaba la CI
      # entera (detekt solo mira estilo, no tipa). Ejecutarlos necesita emulador
      # y eso se hace fuera de la CI, pero al menos tienen que compilar.
      - name: Verificar y compilar
        run: >-
          ./gradlew --no-daemon check assembleDebug assembleDebugAndroidTest koverXmlReport

      - name: Reunir los informes SARIF de detekt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/sarif
          find . -path '*/build/reports/detekt/detekt.sarif' -print0 |
            while IFS= read -r -d '' file; do
              module="$(echo "${file}" | sed 's|^\./||; s|/build/reports/detekt/detekt.sarif$||; s|/|-|g')"
              cp "${file}" "build/sarif/detekt-${module}.sarif"
            done
          ls -la build/sarif || true

      # Code Scanning necesita GitHub Advanced Security en los repositorios
      # privados, asi que aqui puede devolver 403. No se deja romper la CI: los
      # avisos de detekt ya rompen el build por su cuenta (maxIssues: 0) y los
      # informes se suben igualmente como artefacto en el paso siguiente. Esto
      # es presentacion, no una barrera de calidad.
      - name: Subir detekt a Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/android/build/sarif
          category: detekt

      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/detekt/detekt.html
            apps/android/**/build/reports/lint-results-*.html
            apps/android/**/build/reports/lint-results-*.sarif
            apps/android/**/build/test-results/**/TEST-*.xml
            apps/android/build/reports/kover/report.xml
          if-no-files-found: ignore

      # Las capturas no se versionan (6 MB de PNG y el render depende de las
      # fuentes de la maquina), asi que la unica forma de verlas en un PR es
      # bajarlas de aqui.
      - name: Subir las capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: apps/android/**/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      - name: Subir el APK de debug
        uses: actions/upload-artifact@v7
        with:
          name: gastonomo-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
