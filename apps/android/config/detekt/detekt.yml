# Configuracion de detekt de Gastonomo.
# Se aplica sobre la configuracion por defecto (buildUponDefaultConfig = true),
# asi que aqui solo estan las diferencias. Cualquier violacion rompe el build.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    threshold: 15
  CyclomaticComplexMethod:
    active: true
    threshold: 10
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LargeClass:
    active: true
    threshold: 300
  LongMethod:
    active: true
    threshold: 50
  LongParameterList:
    active: true
    functionThreshold: 5
    constructorThreshold: 5
    ignoreDefaultParameters: false
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
    ignorePrivate: false
    ignoreOverridden: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  SuspendFunSwallowedCancellation:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  TooGenericExceptionCaught:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: true
  TopLevelPropertyNaming:
    active: true

potential-bugs:
  active: true
  CastToNullableType:
    active: true
  IgnoredReturnValue:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnsafeCallOnNullableType:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'A TODO must reference a ticket, for example TODO(GAS-12).'
        value: 'TODO'
      - reason: 'A FIXME must reference a ticket, for example FIXME(GAS-12).'
        value: 'FIXME'
      - reason: 'STOPSHIP must never reach the main branch.'
        value: 'STOPSHIP'
    allowedPatterns: '(TODO|FIXME)\(GAS-\d+\)'
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreAnnotated:
      - 'Preview'
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 2
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 2
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'
  UnusedPrivateProperty:
    active: true
  UseDataClass:
    active: false
  WildcardImport:
    active: true

formatting:
  active: true
  android: true
  autoCorrect: false
  MaximumLineLength:
    active: true
    maxLineLength: 120
  FinalNewline:
    active: true
  NoWildcardImports:
    active: true
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
