# JVM del daemon de Gradle. 3 GB deja margen a los 6 modulos y a los workers de Kotlin.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Ejecuta modulos independientes en paralelo. Compatible con la configuration cache.
# Cuantas tareas puede correr Gradle a la vez. Sin este limite Gradle usa un
# worker por nucleo, y cada tarea de test forkea una JVM de 2 GB (Robolectric con
# Compose no cabe en menos). En una maquina de 16 nucleos eso son 32 GB solo de
# tests, mas 3 GB del daemon: el sistema mata el build y Gradle lo reporta como
# java.io.EOFException, que parece un test roto y es falta de memoria.
#
# La CI nunca lo vio porque el runner de GitHub tiene 4 nucleos, asi que ya
# estaba limitado de hecho. Fijarlo en 4 hace que local y CI se comporten igual:
# 4 x 2 GB de tests + 3 GB de daemon caben de sobra.
org.gradle.workers.max=4
org.gradle.parallel=true

# Reutiliza salidas de tareas entre builds y entre maquinas (build cache local).
org.gradle.caching=true

# Salta la fase de configuracion cuando nada relevante cambia.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# AndroidX y estilo oficial de Kotlin.
android.useAndroidX=true
kotlin.code.style=official

# Mantiene el orden de recursos no transitivos: cada modulo solo ve sus propios R.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
