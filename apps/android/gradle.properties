# JVM del daemon de Gradle. 3 GB deja margen a los 6 modulos y a los workers de Kotlin.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Ejecuta modulos independientes en paralelo. Compatible con la configuration cache.
org.gradle.parallel=true

# Reutiliza salidas de tareas entre builds y entre maquinas (build cache local).
org.gradle.caching=true

# Salta la fase de configuracion cuando nada relevante cambia.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# AndroidX y estilo oficial de Kotlin.
android.useAndroidX=true
kotlin.code.style=official

# Mantiene el orden de recursos no transitivos: cada modulo solo ve sus propios R.
android.nonTransitiveRClass=true
