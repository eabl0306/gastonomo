[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
gastonomo-domain = { path = "crates/domain", version = "0.1.0" }
gastonomo-application = { path = "crates/application", version = "0.1.0" }
gastonomo-infrastructure = { path = "crates/infrastructure", version = "0.1.0" }
gastonomo-http = { path = "crates/http", version = "0.1.0" }

async-trait = "0.1.92"
figment = { version = "0.10.19", features = ["env"] }
salvo = { version = "0.96", default-features = false, features = [
  "server",
  "server-handle",
  "http1",
  "http2",
  "test",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
] }
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5", features = ["openapi_extensions"] }
uuid = { version = "1.26", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_crate_dependencies = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cognitive_complexity = "deny"
# Restriction lint: no entra por `all`/`pedantic`/`nursery`, hay que pedirlo.
# Sin esta linea el umbral de clippy.toml no hace nada.
excessive_nesting = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
indexing_slicing = "deny"
# Allowed on purpose: these fight against module layout and DTO naming that we
# want to keep explicit. Everything else in pedantic/nursery stays on.
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# La documentacion en prose va en castellano y cita nombres de producto
# (Salvo, SQLx, PostgreSQL) que este lint quiere entre backticks.
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
