[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
gastonomo-domain = { path = "crates/domain", version = "0.1.0" }
gastonomo-application = { path = "crates/application", version = "0.1.0" }
gastonomo-infrastructure = { path = "crates/infrastructure", version = "0.1.0" }
gastonomo-http = { path = "crates/http", version = "0.1.0" }

argon2 = "0.6"
async-trait = "0.1.92"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
figment = { version = "0.10.19", features = ["env"] }
hmac = "0.13"
# Sin backend de criptografia: `rust_crypto` arrastra `rsa`, que tiene un aviso de
# seguridad sin parche (RUSTSEC-2023-0071) y tumbaria `cargo deny`. El proveedor
# HS256 lo montamos con hmac y sha2 en crates/infrastructure/src/security.
jsonwebtoken = { version = "11.1", default-features = false }
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls",
] }
# Sin la feature `serde`: los importes se serializan a mano como string, y asi el
# nucleo no alcanza serde (lo comprueba crates/api/tests/architecture.rs).
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
salvo = { version = "0.96", default-features = false, features = [
  "server",
  "server-handle",
  "http1",
  "http2",
  "test",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "rust_decimal",
] }
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5", features = ["openapi_extensions"] }
uuid = { version = "1.26", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_crate_dependencies = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cognitive_complexity = "deny"
# Restriction lint: no entra por `all`/`pedantic`/`nursery`, hay que pedirlo.
# Sin esta linea el umbral de clippy.toml no hace nada.
excessive_nesting = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
indexing_slicing = "deny"
# Allowed on purpose: these fight against module layout and DTO naming that we
# want to keep explicit. Everything else in pedantic/nursery stays on.
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# La documentacion en prose va en castellano y cita nombres de producto
# (Salvo, SQLx, PostgreSQL) que este lint quiere entre backticks.
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
