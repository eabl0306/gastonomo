# Entorno local de la API: PostgreSQL mas el binario con recarga en caliente.
#
#   docker compose -f apps/api/docker-compose.yml up
#
# Para lanzar solo la base de datos y trabajar con cargo en local:
#
#   docker compose -f apps/api/docker-compose.yml up -d postgres

name: gastonomo-api

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gastonomo
      POSTGRES_PASSWORD: gastonomo
      POSTGRES_DB: gastonomo
    ports:
      # El puerto publicado se puede mover con POSTGRES_PORT cuando 5432 ya
      # esta ocupado en la maquina.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 guarda los datos en un subdirectorio por version mayor: el
      # volumen va en /var/lib/postgresql, no en /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastonomo -d gastonomo"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GASTONOMO__DATABASE__URL: postgres://gastonomo:gastonomo@postgres:5432/gastonomo
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-dev:/app/target-dev

volumes:
  postgres-data:
  cargo-registry:
  target-dev:
