# Entorno local de SOLO la API: PostgreSQL, Mailpit y el binario con recarga en
# caliente. Es un atajo para trabajar dentro de apps/api sin levantar la web.
#
#   docker compose -f apps/api/docker-compose.yml up
#
# Para lanzar solo la base de datos y trabajar con cargo en local:
#
#   docker compose -f apps/api/docker-compose.yml up -d postgres
#
# La pila de desarrollo del monorepo es la de compose.yaml en la raiz, y es la que
# usan las recetas de `just` (just up, just db-up, just api-test-db). Esta publica
# a proposito otros puertos (5433, 8081, 8026 y 1026) para que las dos puedan
# convivir: cuando las dos usaban el 5432, levantar la segunda dejaba un
# contenedor muerto y los tests apuntando a la base equivocada.

name: gastonomo-api

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gastonomo
      POSTGRES_PASSWORD: gastonomo
      POSTGRES_DB: gastonomo
    ports:
      # 5433 y no 5432: el 5432 es de la pila de la raiz. Se mueve con
      # API_POSTGRES_PORT.
      - "${API_POSTGRES_PORT:-5433}:5432"
    volumes:
      # postgres:18 guarda los datos en un subdirectorio por version mayor: el
      # volumen va en /var/lib/postgresql, no en /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastonomo -d gastonomo"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Buzon de correo de desarrollo. Los correos de recuperacion de contrasena se
  # leen en http://localhost:8026, que es el de esta pila: el 8025 es el de la
  # pila de la raiz.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${API_MAILPIT_WEB_PORT:-8026}:8025"
      - "${API_MAILPIT_SMTP_PORT:-1026}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      GASTONOMO__DATABASE__URL: postgres://gastonomo:gastonomo@postgres:5432/gastonomo
      # Correo por SMTP contra Mailpit: sin TLS y sin credenciales.
      GASTONOMO__MAIL__DRIVER: smtp
      GASTONOMO__MAIL__HOST: mailpit
      GASTONOMO__MAIL__PORT: "1025"
    ports:
      # 8081 y no 8080, por lo mismo que el 5433.
      - "${API_STANDALONE_PORT:-8081}:8080"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-dev:/app/target-dev

volumes:
  postgres-data:
  cargo-registry:
  target-dev:
