# Configuracion completa (no solo un server block) para poder correr nginx
# como usuario sin privilegios: PID y ficheros temporales fuera de /var.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # La politica de cache se resuelve por URI en vez de con un add_header dentro
  # de cada location. nginx NO hereda los add_header de un bloque padre cuando el
  # hijo declara los suyos: los reemplaza. Con un add_header de cache anidado, las
  # cabeceras de seguridad del server desaparecian justo en las rutas que sirven
  # contenido (/, /assets/ y el fallback del SPA). Aqui todos los add_header
  # viven en un unico nivel, asi que no hay nada que se pueda perder.
  #
  # Solo los assets con hash en el nombre se cachean para siempre. El resto,
  # empezando por el index.html que apunta a ellos, nunca se cachea.
  #
  # El add_header de Cache-Control va SIN "always" a proposito: asi solo sale en
  # respuestas buenas. Un 404 bajo /assets/ (deploy a medias, por ejemplo) no
  # debe quedarse cacheado un ano en el navegador del usuario.
  map $uri $cache_policy {
    default    "no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_policy;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida la resuelve el router del cliente.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
